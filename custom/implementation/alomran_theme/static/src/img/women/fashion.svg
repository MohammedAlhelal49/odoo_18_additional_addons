  <rect x="330" y="392" width="26" height="36" rx="3" fill="#9cb8a5"/><rect x="326" y="388" width="34" height="6" fill="#d9c2b0"/><rect x="326" y="426" width="34" height="6" fill="#d9c2b0"/>
  <rect x="364" y="398" width="22" height="30" rx="3" fill="#c9a15b"/><rect x="360" y="394" width="30" height="6" fill="#d9c2b0"/><rect x="360" y="426" width="30" height="6" fill="#d9c2b0"/>
