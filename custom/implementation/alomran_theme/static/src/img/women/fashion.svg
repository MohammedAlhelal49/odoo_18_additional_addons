  <ellipse cx="250" cy="432" rx="46" ry="8" fill="#8a6a5c"/>
  <rect x="246" y="70" width="8" height="30" fill="#8a6a5c"/>
  <circle cx="250" cy="66" r="10" fill="#8a6a5c"/>
  <path d="M195 110 Q250 92 305 110 L296 175 Q250 190 204 175 Z" fill="#f4e4da"/>
  <path d="M204 150 Q250 165 296 150 L300 175 Q330 300 345 400 Q250 420 155 400 Q170 300 200 175 Z" fill="url(#dress)"/>
  <path d="M204 150 Q250 168 296 150 L298 165 Q250 182 202 165 Z" fill="#b8636b"/>
  <path d="M250 182 Q240 300 215 405" stroke="#d58a8f" stroke-width="3" fill="none" opacity=".6"/>
  <path d="M250 182 Q262 300 290 408" stroke="#b8636b" stroke-width="3" fill="none" opacity=".5"/>
