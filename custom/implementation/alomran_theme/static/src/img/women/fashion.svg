    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7a1a3"/><stop offset="1" stop-color="#c9767d"/></linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <!-- window light -->
  <rect x="520" y="40" width="210" height="260" rx="8" fill="#fff" opacity=".45"/>
  <line x1="625" y1="40" x2="625" y2="300" stroke="#f3d9d3" stroke-width="6"/>
  <line x1="520" y1="170" x2="730" y2="170" stroke="#f3d9d3" stroke-width="6"/>
  <!-- table -->
