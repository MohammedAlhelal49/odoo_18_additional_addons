    <ellipse cx="715" cy="330" rx="12" ry="40" transform="rotate(25 715 330)"/>
    <ellipse cx="680" cy="340" rx="11" ry="34" transform="rotate(-50 680 340)"/>
    <ellipse cx="730" cy="350" rx="10" ry="30" transform="rotate(55 730 350)"/>
  </g>
