  <g transform="translate(620 120) rotate(18)"><rect x="0" y="0" width="28" height="150" rx="10" fill="#c86f76"/><rect x="0" y="0" width="28" height="44" rx="10" fill="url(#gold)"/></g>
  <!-- blush puff -->
  <ellipse cx="120" cy="330" rx="60" ry="26" fill="#f4d3cb"/><ellipse cx="120" cy="320" rx="60" ry="26" fill="#fbe8e3"/>
  <!-- sparkles -->
  <g fill="#fff"><path d="M680 260 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6z"/><path d="M380 110 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z"/><path d="M110 150 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5z"/></g>
