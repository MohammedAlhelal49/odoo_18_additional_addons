    <rect x="10" y="10" width="280" height="110" rx="12" fill="#3b3b45"/>
    <g>
      <circle cx="50" cy="45" r="22" fill="#f2c9b8"/><circle cx="105" cy="45" r="22" fill="#e09a8f"/><circle cx="160" cy="45" r="22" fill="#c86f76"/><circle cx="215" cy="45" r="22" fill="#9a5a63"/><circle cx="262" cy="45" r="18" fill="#e6c88e"/>
      <circle cx="50" cy="92" r="20" fill="#d9a77e"/><circle cx="105" cy="92" r="20" fill="#b07a5e"/><circle cx="160" cy="92" r="20" fill="#7c5a4e"/><circle cx="215" cy="92" r="20" fill="#f6dfd3"/><circle cx="262" cy="92" r="16" fill="#c9a15b"/>
    </g>
  </g>
  <!-- lipsticks -->
  <g transform="translate(470 160)">
    <rect x="0" y="60" width="44" height="70" rx="6" fill="url(#gold)"/><rect x="6" y="20" width="32" height="44" fill="#c9a15b"/><path d="M8 22 L8 -10 Q22 -30 36 -2 L36 22 Z" fill="#b8434f"/>
  </g>
  <g transform="translate(540 175)">
    <rect x="0" y="50" width="40" height="66" rx="6" fill="#2b2b33"/><rect x="6" y="16" width="28" height="38" fill="url(#gold)"/><path d="M8 18 L8 -8 Q20 -24 32 -2 L32 18 Z" fill="#d97b84"/>
  </g>
