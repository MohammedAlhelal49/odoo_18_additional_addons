<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Makeup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e1e0"/><stop offset="1" stop-color="#eec4c4"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8894a"/><stop offset=".5" stop-color="#e6c88e"/><stop offset="1" stop-color="#b8894a"/></linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <circle cx="660" cy="90" r="120" fill="#fff" opacity=".35"/>
  <circle cx="120" cy="460" r="140" fill="#fff" opacity=".25"/>
  <!-- brush cup -->
  <g>
    <g transform="rotate(-14 230 300)"><rect x="222" y="90" width="14" height="190" rx="5" fill="#2b2b33"/><rect x="221" y="260" width="16" height="30" fill="url(#gold)"/><path d="M216 90 Q229 30 242 90 Z" fill="#e8b7a5"/></g>
    <g transform="rotate(-2 270 300)"><rect x="262" y="80" width="16" height="200" rx="6" fill="#c86f76"/><rect x="261" y="250" width="18" height="34" fill="url(#gold)"/><path d="M254 82 Q270 10 286 82 Z" fill="#f2d2c4"/></g>
    <g transform="rotate(12 310 300)"><rect x="302" y="100" width="12" height="180" rx="5" fill="#2b2b33"/><rect x="301" y="255" width="14" height="28" fill="url(#gold)"/><path d="M296 102 Q308 55 320 102 Z" fill="#d79b8f"/></g>
    <path d="M200 270 L340 270 L330 420 Q270 435 210 420 Z" fill="#fff"/>
    <path d="M200 270 L340 270 L338 292 L202 292 Z" fill="url(#gold)"/>
  </g>
  <!-- compact palette -->
  <g transform="translate(400 300)">
