  <g fill="none" stroke="#c9a15b" stroke-width="2.5" opacity=".8"><path d="M330 210 Q300 150 320 90"/><path d="M322 160 Q296 152 290 128 Q314 134 322 160 Z"/><path d="M318 125 Q340 116 344 92 Q322 100 318 125 Z"/></g>
