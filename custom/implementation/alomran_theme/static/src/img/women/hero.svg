    <g stroke="#7a6a73" stroke-width="2" fill="none"><circle cx="430" cy="584" r="6"/><path d="M424 592 L436 592 L442 616 L462 664 L398 664 L418 616 Z"/><circle cx="530" cy="584" r="6"/><path d="M524 592 L536 592 L540 610 L556 664 L508 664 L520 610 Z"/></g>
